name: Deploy runnable examples

on:
  push:
    branches: [main]
    paths:
      - "solar-system/**"
      - "gallery-manifest.json"
      - "scripts/stage-pages.mjs"
      - "scripts/validate-gallery.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-examples.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Rollup native binary for the Linux runner
        shell: bash
        run: |
          ROLLUP_NATIVE_VERSION="$(node -p "require('./solar-system/node_modules/rollup/package.json').version")"
          npm install --no-save --workspace solar-system "@rollup/rollup-linux-x64-gnu@${ROLLUP_NATIVE_VERSION}"
      - run: npm run pages:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
