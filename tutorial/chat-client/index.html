<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Client</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(165deg, #f5f7fb 0%, #e4ecf7 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      #app-root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #modal-root {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }

      #chat-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        width: min(720px, 92vw);
        margin: 0 auto;
        padding: 3rem 0 2rem;
      }

      .chat-panel {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <div id="modal-root"></div>
      <main id="chat-shell">
        <section id="chat-history" class="chat-panel"></section>
        <section id="chat-composer" class="chat-panel"></section>
      </main>
    </div>
    <script type="module" src="./chat-client-app.js"></script>
  </body>
</html>
